<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maple Layers</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main class="app">
    <aside class="side" aria-label="Preview and colour">
      <div class="stage-box" id="stage"><canvas id="preview" aria-label="Character preview"></canvas>
        <div class="stage-tools" id="stage-tools"></div>
        <span class="stage-note" id="stage-note" role="status"></span></div>
      <section class="colour" id="colour" aria-label="Colour"></section>
    </aside>
    <section class="book" aria-label="Catalogue">
      <div class="cover">
        <div class="page">
          <header class="book-head">
            <h2 id="chapter"></h2>
            <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
          </header>
          <div class="source-row" id="source"></div>
          <div class="filters" id="filters"></div>
          <div class="toolbar" id="toolbar"></div>
          <div class="scroll" id="content" role="tabpanel"></div>
          <p class="ph-note" id="ph-note" role="status"></p>
        </div>
      </div>
      <nav class="chapters" id="tabs" role="tablist" aria-label="Catalogue chapters"></nav>
    </section>
    <p class="note">Sprites © Nexon, served by <a href="https://maplestory.io" target="_blank" rel="noopener">maplestory.io</a>. Item names and ids from <a href="https://henesys.gg" target="_blank" rel="noopener">henesys.gg</a>, <a href="https://meowdb.com" target="_blank" rel="noopener">MeowDB</a> and the <a href="https://mapleclassic.wiki" target="_blank" rel="noopener">Maple Classic Wiki</a>. Dye behaviour from <a href="https://meaegi.com" target="_blank" rel="noopener">meaegi.com</a>.</p>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
